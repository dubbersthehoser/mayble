name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:

  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"

      - name: Enable Ubuntu arm64 packages
        shell: bash
        run: |
          set -euxo pipefail

          sudo dpkg --add-architecture arm64

          # Restrict the runner's existing repositories to amd64.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types:/a Architectures: amd64' \
              /etc/apt/sources.list.d/ubuntu.sources
          else
            sudo sed -i -E 's|^(deb )|\1[arch=amd64] |' \
              /etc/apt/sources.list
          fi

          # Add arm64 repositories from the Ubuntu ports mirror.
          sudo tee /etc/apt/sources.list.d/arm64.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble-security
          Components: main restricted universe multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          sudo apt-get update

      - name: Install Fyne Tool
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Install Fyne Cross
        run: go install github.com/fyne-io/fyne-cross@latest

      - name: Building Packages
        shell: bash
        run: |
          set -euo pipefail
          [ ! -x ./scripts/build-ubuntu-release.sh ] && chmod 744 ./scripts/build-ubuntu-release.sh
          ./scripts/build-ubuntu-release.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: ./dist/*

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: downloads/

      - name: Create Github Release and Upload Binaries
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: downloads/*
          generateReleaseNotes: true
