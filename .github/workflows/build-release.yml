name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:

  build:
    name: Build Ubuntu AMD64 with ARM64
    run-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"

      - name: Setup ARM64 APT Package Libs
        uses: ryankurte/action-apt@v0.4.0
        with:
          arch: arm64

      - name: Install Fyne Tool
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Install Fyne Cross
        run: go install github.com/fyne-io/fyne-cross@latest

      - name: Building Packages
        shell: bash
        run: |
          set -euo pipefail
          [! -x ./scripts/build-ubuntu-release.sh ] && chmod 744 ./scripts/build-ubuntu-release.sh
          ./scripts/build-ubuntu-release.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: ./dist/*

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: downloads/

      - name: Create Github Release and Upload Binaries
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: downloads/*
          generateReleaseNotes: true
