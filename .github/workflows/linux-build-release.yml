name: Linux Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:

  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix: 
        include:
          - arch: amd64
            os: linux
          - arch: arm64
            os: linux

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"

      - name: Install Fyne Cross
        run: go install github.com/fyne-io/fyne-cross@latest

      - name: Build (${{ matrix.os }}/${{ matrix.arch }})
        shell: bash
        run: |
          set -euo pipefail

          APP_NAME="mayble"
          MAIN_PKG="."
          NAME="${APP_NAME}_linux_${{ matrix.arch }}"

          OUT_DIR="./dist"
          mkdir -p "$OUT_DIR"

          FYNE_CROSS_OUT="fyne-cross/dist/${{ matrix.os }}-${{ matrix.arch }}"

          fyne-cross linux -release -arch=${{ matrix.arch }} -name "${NAME}"
          mv -v "${FYNE_CROSS_OUT}/${APP_NAME}.tar.xz" "${OUT_DIR}/"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-dist
          path: dist/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download amd64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: amd64-dist
          path: dist/amd64

      - name: Download arm64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: arm64-dist
          path: dist/arm64

      - name: Create Github Release and Upload Binaries
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: |
            dist/amd64/*
            dist/arm64/*
          generateReleaseNotes: true
