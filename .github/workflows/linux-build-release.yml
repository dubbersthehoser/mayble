name: Linux Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:

  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: 
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"

      - name: Install Fyne dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev

      - name: Build (${{ matrix.arch }})
        shell: bash
        run: |
          set -euo pipefail

          APP_NAME="mayble"
          MAIN_PKG="."

          OUT_DIR="./dist"
          mkdir -p "$OUT_DIR"

          GOOS=linux                  \
          GOARCH=${{ matrix.goarch }} \
          CGO_ENABLED=1               \
          go build -v -o "$OUT_DIR/${APP_NAME}_linux_${{ matrix.arch }}" "$MAIN_PKG"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-dist
          path: dist/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download amd64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: amd64-dist
          path: dist/amd64

      - name: Download arm64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: arm64-dist
          path: dist/arm64

      - name: Create Github Release and Upload Binaries
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: |
            dist/amd64/*
            dist/arm64/*
          generateReleaseNotes: true


